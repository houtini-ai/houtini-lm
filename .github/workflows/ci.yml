name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.x is the engines floor (node:sqlite); 24.x is current.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Builds (tsc, strict) then runs the unit suite over the pure modules.
      - run: npm test
      # Pure-logic script tests that need no LLM endpoint.
      - run: npm run test:overflow
      - run: npm run test:lock
